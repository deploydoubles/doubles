# Reference setup for the conformance run (scripts/conformance.sh).
# Builds from the monorepo root so the checks library under test is the one
# in this working tree (MONOREPO=1).

name: dd-laravel-mysql-redis-worker

x-app: &app
  build:
    context: ../..
    dockerfile: doubles/laravel-mysql-redis-worker/docker/Dockerfile
    args:
      APP_DIR: doubles/laravel-mysql-redis-worker
      MONOREPO: "1"
      REVISION: ${REVISION:-}
  image: deploydoubles-conformance/laravel-mysql-redis-worker:local
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    # A throwaway key for a throwaway app; platforms generate their own.
    APP_KEY: base64:ZGVwbG95ZG91Ymxlcy1jb25mb3JtYW5jZS1vbmx5ISE=
    LOG_CHANNEL: stderr
    # URL style for the database...
    DATABASE_URL: mysql://double:double@mysql:3306/double
    # ...and discrete variables for Redis: the double accepts both.
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_CLIENT: phpredis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: file
  volumes:
    - storage:/app/storage

services:
  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "${DD_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 3s
      timeout: 5s
      retries: 40

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: double
      MYSQL_USER: double
      MYSQL_PASSWORD: double
      MYSQL_ROOT_PASSWORD: double-root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udouble", "-pdouble"]
      interval: 3s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  storage:
