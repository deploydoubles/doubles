# Regenerates every double's lockfile against the published check libraries
# and opens a pull request. Run once by hand after the first publish of
# deploydoubles/checks-php (and @deploydoubles/checks); Renovate keeps the
# lockfiles current afterwards.
#
# A pull request opened with GITHUB_TOKEN does not trigger other workflows:
# close and reopen it (or push an empty commit) to run conformance on it.

name: lock-refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh lockfiles
        run: |
          for dir in doubles/*/; do
            if [ -f "$dir/composer.json" ] && jq -e '.require["deploydoubles/checks-php"]' "$dir/composer.json" >/dev/null; then
              (cd "$dir" && composer update deploydoubles/checks-php --no-install --no-scripts --no-interaction --no-progress)
            fi
            if [ -f "$dir/package.json" ] && jq -e '.dependencies["@deploydoubles/checks"]' "$dir/package.json" >/dev/null; then
              (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            fi
          done
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          branch="chore/lock-refresh-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(doubles): refresh lockfiles against the published check libraries"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(doubles): refresh lockfiles against the published check libraries" \
            --body "Regenerated by the lock-refresh workflow. Close and reopen this pull request to run conformance."
