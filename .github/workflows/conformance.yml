name: conformance

on:
  pull_request:
    paths:
      - 'doubles/**'
      - 'checks/**'
      - 'verifier/**'
      - 'spec/**'
      - 'scripts/**'
      - 'catalog.json'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate examples against the schemas
        run: |
          npx --yes ajv-cli@5 validate -s spec/schema/report-v0.1.json -d "spec/examples/report-*.json" --spec=draft2020
          npx --yes ajv-cli@5 validate -s spec/schema/manifest-v0.1.json -d "spec/examples/double-*.json" --spec=draft2020
          npx --yes ajv-cli@5 validate -s spec/schema/manifest-v0.1.json -d "doubles/*/double.json" --spec=draft2020
      - name: catalog.json is generated, never hand-edited
        run: scripts/build-catalog --check

  checks-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: checks/php
      - run: vendor/bin/pest
        working-directory: checks/php

  checks-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The hints parity test compares the Node hints with checks-php's Codes::hint().
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
        working-directory: checks/node
      - run: npm run build
        working-directory: checks/node
      - run: npm test -- --run
        working-directory: checks/node

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: verifier
      - run: npm run build
        working-directory: verifier
      - run: npm test -- --run
        working-directory: verifier

  changed:
    runs-on: ubuntu-latest
    outputs:
      doubles: ${{ steps.pick.outputs.doubles }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        name: Pick the doubles to run
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(for manifest in doubles/*/double.json; do basename "$(dirname "$manifest")"; done | sort)
          if [ -z "${BASE:-}" ]; then
            selected="$all"
          else
            files=$(git diff --name-only "$BASE"...HEAD)
            if echo "$files" | grep -qE '^(checks|verifier|spec|scripts)/|^\.github/workflows/conformance\.yml$'; then
              selected="$all"
            else
              selected=$(echo "$files" | sed -nE 's#^doubles/([^/]+)/.*#\1#p' | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi
          echo "doubles=$(echo "$selected" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  double:
    needs: [changed, verifier]
    if: needs.changed.outputs.doubles != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        double: ${{ fromJSON(needs.changed.outputs.doubles) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the verifier
        run: npm ci && npm run build
        working-directory: verifier
      - name: Conformance
        env:
          DOUBLE: ${{ matrix.double }}
        run: scripts/conformance.sh "$DOUBLE"
      - name: Revert control — without its result producer or database the double must fail
        env:
          DOUBLE: ${{ matrix.double }}
        run: |
          # The worker when one is declared; otherwise a cron service, if the Compose file has one;
          # otherwise the database, stopped after startup (a Compose service named after it).
          manifest="doubles/$DOUBLE/double.json"
          services=$(docker compose -f "doubles/$DOUBLE/docker-compose.yml" config --services)
          database=$(jq -r '.services.database // empty' "$manifest")
          if jq -e '.processes.worker' "$manifest" >/dev/null; then
            control=(--without worker)
          elif printf '%s\n' "$services" | grep -qx cron; then
            control=(--without cron)
          elif [ -n "$database" ] && printf '%s\n' "$services" | grep -qx "$database"; then
            control=(--stop "$database")
          else
            control=()
          fi
          if [ "${#control[@]}" -gt 0 ]; then
            if scripts/conformance.sh "$DOUBLE" "${control[@]}"; then
              echo "::error::$DOUBLE passed with ${control[*]}: the check that should catch that cannot fail"
              exit 1
            fi
          else
            echo "no worker, cron or database service; skipped"
          fi
      - name: Revert control — without its scheduler the double must fail
        env:
          DOUBLE: ${{ matrix.double }}
        run: |
          if docker compose -f "doubles/$DOUBLE/docker-compose.yml" config --services | grep -qx scheduler; then
            if scripts/conformance.sh "$DOUBLE" --without scheduler; then
              echo "::error::$DOUBLE passed without its scheduler: the check that should catch that cannot fail"
              exit 1
            fi
          else
            echo "no scheduler service (cron doubles are covered above); skipped"
          fi
