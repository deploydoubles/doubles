name: conformance

on:
  pull_request:
    paths:
      - 'doubles/**'
      - 'checks/**'
      - 'verifier/**'
      - 'spec/**'
      - 'scripts/**'
      - 'catalog.json'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate examples against the schemas
        run: |
          npx --yes ajv-cli@5 validate -s spec/schema/report-v0.1.json -d "spec/examples/report-*.json" --spec=draft2020
          npx --yes ajv-cli@5 validate -s spec/schema/manifest-v0.1.json -d "spec/examples/double-*.json" --spec=draft2020
          npx --yes ajv-cli@5 validate -s spec/schema/manifest-v0.1.json -d "doubles/*/double.json" --spec=draft2020
      - name: catalog.json is generated, never hand-edited
        run: scripts/build-catalog --check

  checks-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, redis
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: checks/php
      - run: vendor/bin/pest
        working-directory: checks/php

  checks-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The hints parity test compares the Node hints with checks-php's Codes::hint().
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - run: npm ci
        working-directory: checks/node
      - run: npm run build
        working-directory: checks/node
      - run: npm test -- --run
        working-directory: checks/node

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: verifier
      - run: npm run build
        working-directory: verifier
      - run: npm test -- --run
        working-directory: verifier

  changed:
    runs-on: ubuntu-latest
    outputs:
      doubles: ${{ steps.pick.outputs.doubles }}
      failure_cells: ${{ steps.pick.outputs.failure_cells }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        name: Pick the doubles to run
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(for manifest in doubles/*/double.json; do basename "$(dirname "$manifest")"; done | sort)
          if [ -z "${BASE:-}" ]; then
            selected="$all"
          else
            files=$(git diff --name-only "$BASE"...HEAD)
            if echo "$files" | grep -qE '^(checks|verifier|spec|scripts)/|^\.github/workflows/conformance\.yml$'; then
              selected="$all"
            else
              selected=$(echo "$files" | sed -nE 's#^doubles/([^/]+)/.*#\1#p' | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi
          echo "doubles=$(echo "$selected" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

          # The failure modes each selected double declares, one cell per mode, plus two cells per
          # double that guard the others: the same mode on another commit (the double must stay
          # healthy) and the same mode with no variable at all (the assertions must fail). `boot`
          # carries both when declared, otherwise the first rejected mode.
          cells=""
          for double in $selected; do
            manifest="doubles/$double/double.json"
            modes=$(jq -r '.failure_modes[]?.id' "$manifest")
            [ -n "$modes" ] || continue
            guard=$(jq -r '[.failure_modes[] | select(.expect == "rejected") | .id] as $r | (if ($r | index("boot")) then "boot" else ($r[0] // empty) end)' "$manifest")
            for mode in $modes; do
              cells="${cells}$(jq -cn --arg d "$double" --arg m "$mode" '{double: $d, mode: $m, kind: "fires"}')"$'\n'
            done
            if [ -n "$guard" ]; then
              cells="${cells}$(jq -cn --arg d "$double" --arg m "$guard" '{double: $d, mode: $m, kind: "other-commit"}')"$'\n'
              cells="${cells}$(jq -cn --arg d "$double" --arg m "$guard" '{double: $d, mode: $m, kind: "control"}')"$'\n'
            fi
          done
          echo "failure_cells=$(printf '%s' "$cells" | jq -cs 'map(select(. != null))')" >> "$GITHUB_OUTPUT"

  double:
    needs: [changed, verifier]
    if: needs.changed.outputs.doubles != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        double: ${{ fromJSON(needs.changed.outputs.doubles) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the verifier
        run: npm ci && npm run build
        working-directory: verifier
      - name: Conformance
        env:
          DOUBLE: ${{ matrix.double }}
        run: scripts/conformance.sh "$DOUBLE"
      # Each control removes one thing the double needs and asserts the exact failure: verifier exit 1
      # and the named check failing in its --json output. A worker → queue; a cron or scheduler
      # service → scheduler (every one the Compose file has); with none of those, the database,
      # stopped after startup → database.
      - name: Revert controls — without a producer or its database the double must fail on the matching check
        env:
          DOUBLE: ${{ matrix.double }}
        run: |
          manifest="doubles/$DOUBLE/double.json"
          services=$(docker compose -f "doubles/$DOUBLE/docker-compose.yml" config --services)
          database=$(jq -r '.services.database // empty' "$manifest")
          controls=()
          if jq -e '.processes.worker' "$manifest" >/dev/null; then
            controls+=("--without worker queue")
          fi
          for producer in cron scheduler; do
            if grep -qx "$producer" <<< "$services"; then
              controls+=("--without $producer scheduler")
            fi
          done
          if [ "${#controls[@]}" -eq 0 ] && [ -n "$database" ] && grep -qx "$database" <<< "$services"; then
            controls+=("--stop $database database")
          fi
          if [ "${#controls[@]}" -eq 0 ]; then
            echo "::error::$DOUBLE has no worker, cron, scheduler or database service: nothing proves its checks can fail"
            exit 1
          fi

          failed=0
          for control in "${controls[@]}"; do
            read -r flag service check <<< "$control"
            out="$RUNNER_TEMP/control-$service.json"
            set +e
            scripts/conformance.sh "$DOUBLE" "$flag" "$service" --json-out "$out"
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then
              echo "::error::$DOUBLE $flag $service: verifier exited $code, expected 1 (a check failed)"
              failed=1
            elif ! jq -e --arg check "$check" '.exit_code == 1 and any(.checks[]; .name == $check and .status == "fail")' "$out" >/dev/null; then
              echo "::error::$DOUBLE $flag $service: exit 1, but $check did not fail; the failing checks were: $(jq -r '[.checks[] | select(.status == "fail") | .name] | join(", ")' "$out")"
              failed=1
            else
              echo "$DOUBLE $flag $service: $check failed, as it must"
            fi
          done
          exit "$failed"

  # Every failure mode a double declares, run the way a platform would meet it (spec/failure-modes.md).
  failure:
    needs: [changed, verifier]
    if: needs.changed.outputs.failure_cells != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.changed.outputs.failure_cells) }}
    name: failure (${{ matrix.cell.double }} ${{ matrix.cell.mode }} ${{ matrix.cell.kind }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the verifier
        run: npm ci && npm run build
        working-directory: verifier
      - name: Conformance
        env:
          DOUBLE: ${{ matrix.cell.double }}
          MODE: ${{ matrix.cell.mode }}
          KIND: ${{ matrix.cell.kind }}
        run: |
          case "$KIND" in
            fires)
              scripts/conformance-failure.sh "$DOUBLE" "$MODE"
              ;;
            other-commit)
              scripts/conformance-failure.sh "$DOUBLE" "$MODE" --other-commit
              ;;
            # The control: without the variable the double does not fail, so the mode's assertions
            # must. Exit 1 is "an assertion failed"; 0 would mean they cannot fail, and anything
            # else (64, a crash) is not the control working.
            control)
              set +e
              scripts/conformance-failure.sh "$DOUBLE" "$MODE" --without-variable
              code=$?
              set -e
              if [ "$code" -ne 1 ]; then
                echo "::error::$DOUBLE $MODE without the variable exited $code, expected 1: the assertions did not fail on a double that does not fail"
                exit 1
              fi
              echo "$DOUBLE $MODE without the variable: the assertions failed, as they must"
              ;;
          esac
