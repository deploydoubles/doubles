# Tag-driven publishing. Nothing is ever published from a local machine.
#
#   verifier-v<version>    -> npm package "deploydoubles", staged with provenance through npm
#                             trusted publishing (OIDC); goes live when a maintainer approves the
#                             staged version on npm with 2FA.
#   checks-php-v<version>  -> tag v<version> on deploydoubles/checks-php; Packagist picks it up
#                             through its GitHub hook (needs SPLIT_TOKEN)
#   checks-node-v<version> -> npm package "@deploydoubles/checks", staged the same way as the
#                             verifier
#
# Every publishing job runs in the "release" environment, so its protection rules (who may approve, which
# tags may deploy) gate every publish. Each secret is handed only to the one step that uses it.
# A missing credential fails that step and publishes nothing.

name: release

on:
  push:
    tags:
      - 'verifier-v*'
      - 'checks-php-v*'
      - 'checks-node-v*'

permissions:
  contents: read

jobs:
  verifier:
    if: startsWith(github.ref_name, 'verifier-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#verifier-v}"
          declared=$(node -p "require('./package.json').version")
          [ "$version" = "$declared" ] || { echo "::error::tag $TAG does not match verifier/package.json version $declared"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Stage on npm
        # The trusted publisher on npmjs.com (repository deploydoubles/doubles, workflow
        # release.yml, environment release) allows staging only: a plain `npm publish`
        # from here is rejected by the registry. Staging authenticates with this job's
        # OIDC token; no npm token is stored anywhere. The staged version is invisible
        # to installs until a maintainer approves it with 2FA.
        run: |
          # `npm stage` needs npm 11.15.0 or newer.
          if [ "$(printf '%s\n' 11.15.0 "$(npm --version)" | sort -V | head -n1)" != 11.15.0 ]; then
            npm install --global npm@11
          fi
          npm stage publish --provenance --access public
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "::notice::$name@$version is staged, not live. Approve it on npmjs.com (package → Staged) or with \`npm stage list $name\` then \`npm stage approve <stage-id>\`."

  checks-php:
    if: startsWith(github.ref_name, 'checks-php-v')
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          version="${TAG#checks-php-v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::$TAG is not a semantic version"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - name: Test the library
        working-directory: checks/php
        run: composer install --no-interaction --no-progress && vendor/bin/pest
      - name: Tag the split repository
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::The SPLIT_TOKEN secret is not set; nothing was tagged."; exit 1; }
          version="${TAG#checks-php-v}"
          sha=$(git subtree split --prefix=checks/php HEAD)
          git push "https://x-access-token:${GH_TOKEN}@github.com/deploydoubles/checks-php.git" "$sha:refs/tags/v$version"
          echo "deploydoubles/checks-php v$version -> $sha"

  checks-node:
    if: startsWith(github.ref_name, 'checks-node-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: checks/node
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#checks-node-v}"
          declared=$(node -p "require('./package.json').version")
          [ "$version" = "$declared" ] || { echo "::error::tag $TAG does not match checks/node/package.json version $declared"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - name: Stage on npm
        # The trusted publisher on npmjs.com (repository deploydoubles/doubles, workflow
        # release.yml, environment release) allows staging only: a plain `npm publish`
        # from here is rejected by the registry. Staging authenticates with this job's
        # OIDC token; no npm token is stored anywhere. The staged version is invisible
        # to installs until a maintainer approves it with 2FA.
        run: |
          # `npm stage` needs npm 11.15.0 or newer.
          if [ "$(printf '%s\n' 11.15.0 "$(npm --version)" | sort -V | head -n1)" != 11.15.0 ]; then
            npm install --global npm@11
          fi
          npm stage publish --provenance --access public
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "::notice::$name@$version is staged, not live. Approve it on npmjs.com (package → Staged) or with \`npm stage list $name\` then \`npm stage approve <stage-id>\`."
